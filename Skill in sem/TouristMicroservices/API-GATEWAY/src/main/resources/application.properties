spring.application.name=API-GATEWAY
server.port=8080

# Eureka Discovery Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Fast registry fetch for prompt load-balancing discovery in local testing (in seconds)
eureka.client.registry-fetch-interval-seconds=5

# Spring Cloud Gateway Route Configuration
spring.cloud.gateway.routes[0].id=tourist-service-route
spring.cloud.gateway.routes[0].uri=lb://TOURIST-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/tourist, /tourist/**
